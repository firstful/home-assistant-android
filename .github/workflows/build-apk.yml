# Sutliff CI: build APK for Home Assistant Android companion
# Triggered manually or on push to main
# Uses Gitea Actions runner (docker:22-bookworm, DinD)

name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  # Sutliff: memory-constrained gradle (runner cap 1Gi/100m CPU)
  GRADLE_OPTS: >-
    -Xmx2048m
    -XX:MaxMetaspaceSize=512m
    -Dorg.gradle.jvmargs=-Xmx2048m
  GRADLE_DAEMON: "false"
  GRADLE_WORKERS_MAX: "2"
  GRADLE_CONFIGURE_ON_DEMAND: "true"
  # Skip heavy tasks not needed for APK
  SKIP_KTLINT: "true"
  SKIP_LINT: "true"
  SKIP_SCREENSHOT_TESTS: "true"
  SKIP_FIREBASE: "true"
  # Build args
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS_VERSION: "37.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.ffilt.us:5000/library/docker:28.2.2-dind
      options: >-
        --privileged
        --memory=3.5g
        --memory-swap=4g
        --cpus=1.5
      volumes:
        - gradle-cache:/root/.gradle
        - android-sdk:/opt/android-sdk
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        run: |
          apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip wget
          java -version

      - name: Set up Android SDK
        run: |
          if [ ! -d "/opt/android-sdk/cmdline-tools/latest" ]; then
            mkdir -p /opt/android-sdk/cmdline-tools
            cd /tmp
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdtools.zip
            unzip -q cmdtools.zip -d /opt/android-sdk/cmdline-tools
            mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          fi
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" 2>&1 | tail -3

      - name: Write memory-capped gradle.properties
        run: |
          cat >> gradle.properties << 'EOF'
          # Sutliff: memory-constrained build (runner pod cap 1Gi)
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.configureondemand=true
          org.gradle.caching=true
          android.useAndroidX=true
          # Skip non-essential checks
          ktlint.disabled=true
          lint.abortOnError=false
          # Force pre-installed SDK (no SDK manager download)
          android.sdk.channel=0
          EOF

      - name: Build APK
        id: build
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          BUILD_TYPE=${GITHUB_EVENT_NAME == 'workflow_dispatch' && github.event.inputs.build_type || 'debug'}

          echo "=== Gradle daemon disabled, building $BUILD_TYPE ==="
          ./gradlew --no-daemon \
            :app:assemble${BUILD_TYPE^} \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=false \
            -x ktlintCheck \
            -x lint \
            -x lintDebug \
            -x lintRelease \
            -x test \
            -x testDebugUnitTest \
            -x testReleaseUnitTest \
            --no-daemon \
            --stacktrace \
            2>&1 | tail -20

          echo "=== APK output ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-android-${{ github.sha }}-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload to Sutliff Apps store
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "APK artifact uploaded — promote to store via appstore API"
          echo "::set-output name=apk_path::app/build/outputs/apk"

volumes:
  gradle-cache:
  android-sdk:

name: Build APK

on:
  push:
    branches:
      - main
      - master
      - "sutliff/*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  # Reed's proven-safe gradle heap for homelab runner (3Gi, no daemon)
  GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
  # Skip non-essential tasks to keep build time + memory in budget
  SKIP_KTLINT: "true"

jobs:
  build:
    runs-on: [android]
    container:
      image: cimg/android:2026.07-node
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist Gradle cache (worker side)
        run: |
          if [ -d /root/.gradle/caches ]; then
            echo "Gradle cache available ($(du -sh /root/.gradle | cut -f1))"
          else
            echo "Cold cache — first run will be slow (~20 min download)"
          fi

      - name: Write memory-capped gradle.properties
        # Overwrite the upstream's -Xmx4g with Reed's proven-safe caps
        run: |
          cat > gradle.properties << 'GRADLEPROPS'
          # Sutliff: memory-constrained build (wyse5070 has 7.6Gi no-swap)
          # Reed's proven-safe cap: -Xmx3g
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.configureondemand=true
          org.gradle.caching=true
          android.useAndroidX=true
          # Network resilience (flaky egress through CF tunnel)
          org.gradle.internal.http.connectionTimeout=30000
          org.gradle.internal.http.socketTimeout=30000
          org.gradle.internal.repository.max.retries=5
          org.gradle.internal.repository.initial.backoff=1000
          # Skip heavy checks
          ktlint.disabled=true
          # Match the runner image's preinstalled SDK
          android.sdk.channel=0
          # Java toolchain
          # cimg/android:2026.07-node ships JDK 21 + 17, but the project pins
          # sourceCompatibility = 11. The Gradle toolchain auto-installer
          # downloads JDK 11 once and caches it (works even with flaky egress
          # because the cimg egress is direct, not via the CF tunnel).
          org.gradle.java.installations.auto-download=true
          org.gradle.java.installations.auto-detect=true
          # Disable the screenshot test plugin (not needed for APK builds)
          android.experimental.enableScreenshotTest=true
          GRADLEPROPS
          echo "=== gradle.properties (Sutliff override) ==="
          head -20 gradle.properties

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
          ANDROID_HOME: /opt/android-sdk
        run: |
          echo "=== Building debug APK (gradle heap 3Gi, no daemon) ==="
          # Write full log to file first so we can always see the end of it
          ./gradlew --no-daemon \
            :app:assembleDebug \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=false \
            -x ktlintCheck \
            -x ktlintMainSourceSetCheck \
            -x ktlintTestSourceSetCheck \
            -x lint \
            -x lintAnalyzeDebug \
            -x lintAnalyzeRelease \
            -x test \
            -x testDebugUnitTest \
            --stacktrace 2>&1 | grep -v '^Downloading\|^Downloaded\|^Gradle Runtime Diagnostics' \
            | tee /tmp/gradle-build.log
          GRADLE_EXIT=$?
          echo ""
          echo "=== Gradle exit code: $GRADLE_EXIT ==="
          echo "=== Last 30 lines of gradle output (where the error lives) ==="
          tail -30 /tmp/gradle-build.log
          echo ""
          echo "=== APK output ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ha-android-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
